<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transcript Workbook Utility</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f9fafb;
            --card: #ffffff;
            --text: #111827;
            --text-muted: #6b7280;
            --border: #e5e7eb;
            --success: #10b981;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 20px;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.5;
        }
        .card {
            background: var(--card);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border);
        }
        h1 {
            margin-top: 0;
            color: var(--primary);
            font-size: 24px;
            font-weight: 700;
        }
        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
            margin-top: -15px;
            font-size: 14px;
        }
        .tabs {
            display: flex;
            border-bottom: 2px solid var(--border);
            margin-bottom: 20px;
        }
        .tab-btn {
            padding: 10px 20px;
            border: none;
            background: none;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }
        .tab-btn.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        textarea {
            width: 100%;
            height: 150px;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            resize: vertical;
            font-family: inherit;
        }
        .file-zone {
            border: 2px dashed var(--border);
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            background: #fbfbfb;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .file-zone:hover {
            border-color: var(--primary);
        }
        input[type="file"] {
            display: none;
        }
        .btn {
            padding: 12px 24px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }
        .btn:hover {
            background-color: var(--primary-hover);
        }
        .btn-secondary {
            background-color: #6b7280;
        }
        .btn-secondary:hover {
            background-color: #4b5563;
        }
        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            margin-bottom: 10px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        h3 {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
        }
        #output {
            background: #f3f4f6;
            padding: 16px;
            white-space: pre-wrap;
            border: 1px solid var(--border);
            border-radius: 8px;
            height: 250px;
            overflow-y: auto;
            font-size: 14px;
            color: #374151;
        }
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            font-size: 14px;
        }
        .checkbox-container input {
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Workbook Transcript Processor</h1>
        <p class="subtitle">Clean timestamps, structure lines, and format imported copy blocks locally.</p>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab(event, 'paste-tab')">Paste Raw Copy</button>
            <button class="tab-btn" onclick="switchTab(event, 'file-tab')">Upload Subtitle File</button>
        </div>

        <div id="paste-tab" class="tab-content active">
            <textarea id="rawInput" placeholder="Paste timed transcripts, raw text elements, or subtitle content chunks here..."></textarea>
            <div class="checkbox-container">
                <label><input type="checkbox" id="stripTimestamps" checked> Attempt to strip timestamps (e.g., [00:12], 1:23)</label>
            </div>
            <button class="btn" onclick="processTextData()">Format Text Data</button>
        </div>

        <div id="file-tab" class="tab-content">
            <div class="file-zone" onclick="document.getElementById('fileInput').click()">
                <p id="filePrompt">Click to select or drag '.srt' or '.vtt' files here</p>
                <input type="file" id="fileInput" accept=".srt,.vtt" onchange="handleFileUpload(event)">
            </div>
            <button class="btn" onclick="processUploadedFile()">Extract Text From File</button>
        </div>

        <div class="action-bar">
            <h3>Structured Export Output:</h3>
            <button class="btn btn-secondary" id="copyBtn" onclick="copyToClipboard()" style="padding: 6px 12px; font-size: 13px;">Copy Text</button>
        </div>
        <div id="output">No content parsed yet. Input raw text or upload a timed metadata file above.</div>
    </div>

    <script>
        let uploadedFileContent = "";

        function switchTab(evt, tabId) {
            document.querySelectorAll(".tab-content").forEach((tab) => tab.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach((btn) => btn.classList.remove("active"));
            document.getElementById(tabId).classList.add("active");
            evt.currentTarget.classList.add("active");
        }

        function handleFileUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            document.getElementById("filePrompt").innerText = `Selected: ${file.name}`;
            const reader = new FileReader();
            reader.onload = function (e) {
                uploadedFileContent = e.target.result;
            };
            reader.readAsText(file);
        }

        function cleanTranscriptFormatting(text, removeTimes) {
            let processed = text;
            if (removeTimes) {
                processed = processed.replace(/\[\d+:\d+(:\d+)?\]/g, "");
                processed = processed.replace(/\d+:\d+(:\d+)?(\.\d+)?\s*-->\s*\d+:\d+(:\d+)?(\.\d+)?/g, "");
                processed = processed.replace(/^\d+$/gm, "");
            }

            return processed.replace(/\s+/g, " ").trim();
        }

        function processTextData() {
            const rawText = document.getElementById("rawInput").value;
            const stripTimes = document.getElementById("stripTimestamps").checked;
            const outputDiv = document.getElementById("output");

            if (!rawText.trim()) {
                outputDiv.innerText = "Please paste text into the input field.";
                return;
            }

            outputDiv.innerText = cleanTranscriptFormatting(rawText, stripTimes);
        }

        function processUploadedFile() {
            const outputDiv = document.getElementById("output");
            if (!uploadedFileContent) {
                outputDiv.innerText = "Please select a valid .srt or .vtt file framework first.";
                return;
            }

            outputDiv.innerText = cleanTranscriptFormatting(uploadedFileContent, true);
        }

        function copyToClipboard() {
            const text = document.getElementById("output").innerText;
            if (!text || text.startsWith("No content parsed")) return;

            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById("copyBtn");
                btn.innerText = "Copied!";
                btn.style.backgroundColor = "var(--success)";
                setTimeout(() => {
                    btn.innerText = "Copy Text";
                    btn.style.backgroundColor = "";
                }, 2000);
            });
        }
    </script>
</body>
</html>
